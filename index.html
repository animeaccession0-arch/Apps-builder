<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dual-Engine AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0f0f13; color: #e2e8f0; overflow: hidden; }
        header { padding: 15px; background: #1a1a24; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3d; gap: 15px; flex-wrap: wrap; }
        .logo { font-weight: bold; font-size: 1.1rem; color: #38bdf8; letter-spacing: 0.05em; }
        .controls-group { display: flex; gap: 10px; align-items: center; }
        select { background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; outline: none; }
        select:focus { border-color: #38bdf8; }
        #key-input { background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; width: 220px; transition: border-color 0.2s; }
        #key-input:focus { border-color: #38bdf8; outline: none; }
        #main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #preview-section { flex: 1; background: #ffffff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
        #status-text { padding: 12px; background: #1a1a24; font-size: 0.85rem; color: #94a3b8; border-top: 1px solid #2d2d3d; font-weight: 500; }
        #input-area { display: flex; padding: 12px; background: #14141b; gap: 10px; border-top: 1px solid #2d2d3d; align-items: center; }
        textarea { flex: 1; height: 55px; background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; border-radius: 6px; padding: 10px; resize: none; font-size: 0.9rem; transition: border-color 0.2s; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 0 24px; height: 55px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; font-size: 0.95rem; }
        button:hover { background: #0369a1; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #4b5563; cursor: not-allowed; transform: none; }
    </style>
    <!-- WebLLM CDN loaded securely to execute highly advanced local model runtimes natively -->
    <script type="module">
        import * as webllm from "https://esm.run";
        window.webllm = webllm;
    </script>
</head>
<body>

    <header>
        <div class="logo">🚀 Global AI Studio</div>
        <div class="controls-group">
            <select id="engine-select" onchange="toggleEngineLayout()">
                <option value="gemini">Cloud Engine: User Gemini Key</option>
                <option value="local">Local Engine: 100% Free Browser LLM</option>
            </select>
            <input type="password" id="key-input" placeholder="Enter Your Free Gemini Key" oninput="saveKeyLocally()">
        </div>
    </header>

    <div id="main-container">
        <div id="preview-section">
            <iframe id="app-sandbox" srcdoc="<div style='font-family:sans-serif; text-align:center; padding-top:60px; color:#64748b;'><h3>Pipeline Systems Initialization Complete</h3><p style='font-size:0.9rem; margin-top:8px;'>Choose Cloud Engine to input custom API credentials, or select Local Engine to compile applications for free inside your local hardware architecture.</p></div>"></iframe>
        </div>
        <div id="status-text">Status: Systems online. Awaiting infrastructure runtime selection...</div>
    </div>

    <div id="input-area">
        <textarea id="user-prompt" placeholder="Describe the application, website dashboard, or browser arcade game you want to compile..."></textarea>
        <button id="send-btn" onclick="generateOutput()">Build</button>
    </div>

    <script>
        let localEngineInstance = null;

        // Automatically load previously stored API keys on system boot up
        window.onload = function() {
            const savedKey = localStorage.getItem("user_gemini_key");
            if (savedKey) {
                document.getElementById("key-input").value = savedKey;
                document.getElementById("status-text").innerHTML = "✅ Saved API Key loaded securely from browser memory.";
            }
        };

        function saveKeyLocally() {
            const keyVal = document.getElementById("key-input").value.trim();
            localStorage.setItem("user_gemini_key", keyVal);
        }

        function toggleEngineLayout() {
            const engine = document.getElementById("engine-select").value;
            const keyInput = document.getElementById("key-input");
            const statusBar = document.getElementById("status-text");

            if (engine === "local") {
                keyInput.style.display = "none";
                statusBar.innerHTML = "💡 Local Core Selected: Ready to synthesize modules on device WebGPU structures.";
            } else {
                keyInput.style.display = "block";
                statusBar.innerHTML = "Status: Awaiting custom user Gemini API credential strings...";
            }
        }

        async function generateOutput() {
            const promptInput = document.getElementById("user-prompt");
            const sendBtn = document.getElementById("send-btn");
            const statusBar = document.getElementById("status-text");
            const sandbox = document.getElementById("app-sandbox");
            const keyInput = document.getElementById("key-input");
            const selectedEngine = document.getElementById("engine-select").value;

            const apiKey = keyInput.value.trim();
            const userPromptText = promptInput.value.trim();

            if (!userPromptText) {
                return alert("Validation Alert: App request context cannot be processed empty.");
            }

            promptInput.disabled = true;
            sendBtn.disabled = true;

            const engineeringInstruction = `You are an elite web architect. Build a 100% complete, standalone Data Modeling & Charting dashboard application. Must include client-side interactive SVG charts (Bar/Line/Scatter), dynamic analytical operations (Mean, Regression y=mx+b), localized zero-trust data sandbox badges, and an instant dynamic dropdown global language translation engine. Output ONLY raw, production valid HTML/JS. Do NOT wrap inside markdown blocks. No explanations outside the code elements. Start with <!DOCTYPE html>.`;

            // ================= LAYER 1: LOCAL FREE OFFLINE AI RUNTIME =================
            if (selectedEngine === "local") {
                try {
                    if (!window.webllm) {
                        throw new Error("WebLLM framework execution library blocked or offline.");
                    }
                    
                    statusBar.innerHTML = "📦 Spinning up internal browser sandbox neural layers... (Can take 1-2 mins on initial run)";
                    
                    if (!localEngineInstance) {
                        localEngineInstance = await window.webllm.CreateEngine("Phi3-mini-128k-instruct-q4f16_1-MLC");
                    }

                    statusBar.innerHTML = "🧠 Local LLM Model executing context strings. Compiling layout code directly on GPU...";

                    const messageMatrix = [
                        { role: "system", content: engineeringInstruction },
                        { role: "user", content: userPromptText }
                    ];

                    const chunks = await localEngineInstance.chat.completions.create({ messages: messageMatrix });
                    let localResultStr = chunks.choices[0].message.content.trim();

                    localResultStr = localResultStr.replace(/^```html\s*/i, '').replace(/```\s*$/, '').trim();
                    
                    sandbox.srcdoc = localResultStr;
                    statusBar.innerHTML = "✅ Local Synthesis Complete! App structural instance executed 100% free.";
                    promptInput.value = "";

                } catch (localErr) {
                    console.error(localErr);
                    statusBar.innerHTML = "❌ Local hardware pipeline allocation dropped: " + localErr.message;
                    alert("Hardware Sandbox Engine Exception: Ensure your browser supports WebGPU layers.");
                } finally {
                    promptInput.disabled = false;
                    sendBtn.disabled = false;
                }
                return;
            }

            // ================= LAYER 2: USER CLOUD API KEY RUNTIME =================
            if (!apiKey) {
                promptInput.disabled = false;
                sendBtn.disabled = false;
                return alert("Security Check: Please paste your personal free Gemini API key into the top right input field first.");
            }

            statusBar.innerHTML = "🤖 Routing payload through external client user Key node pipeline...";

            // We list fallback models to switch to if the preferred configuration gives a 402 code
            const targetedModels = [
                "gemini-2.5-flash",
                "gemini-1.5-flash",
                "gemini-1.5-pro"
            ];

            let networkSuccess = false;

            for (let model of targetedModels) {
                try {
                    statusBar.innerHTML = `🤖 Attempting compilation layout via ${model}...`;
                    const secureSafeEndpoint = `https://googleapis.com{model}:generateContent?key=${apiKey}`;
