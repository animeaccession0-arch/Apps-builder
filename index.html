<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Free AI App & Game Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0f0f13; color: #e2e8f0; }
        header { padding: 15px; background: #1a1a24; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3d; }
        .logo { font-weight: bold; font-size: 1.1rem; color: #38bdf8; }
        .badge { background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        #main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #preview-section { flex: 1; background: white; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        #status-bar { padding: 10px; background: #1a1a24; font-size: 0.85rem; color: #94a3b8; border-top: 1px solid #2d2d3d; }
        #input-area { display: flex; padding: 12px; background: #14141b; gap: 10px; border-top: 1px solid #2d2d3d; }
        textarea { flex: 1; height: 55px; background: #1f1f2e; color: white; border: 1px solid #3d3d5c; border-radius: 6px; padding: 10px; resize: none; font-size: 0.9rem; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        button { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🚀 Global AI Studio</div>
        <div class="badge">FREE LIVE SYSTEM</div>
    </header>

    <div id="main-container">
        <div id="preview-section">
            <iframe id="app-sandbox" srcdoc="<div style='font-family:sans-serif; text-align:center; padding-top:40px; color:#64748b;'><h3>Server Status: Connected</h3><p style='font-size:0.9rem; margin-top:8px;'>Type a prompt below to build a full website, mobile app layout, or interactive game instantly.</p></div>>"></iframe>
        </div>
        <div id="status-bar">Status: Ready. Enter a prompt to generate code.</div>
    </div>

    <div id="input-area">
        <textarea id="user-prompt" placeholder="Describe your App, Website, or Game..."></textarea>
        <button id="send-btn" onclick="generateOutput()">Build</button>
    </div>

    <script>
        async function generateOutput() {
            const promptInput = document.getElementById("user-prompt");
            const sendBtn = document.getElementById("send-btn");
            const statusBar = document.getElementById("status-bar");
            const sandbox = document.getElementById("app-sandbox");

            const prompt = promptInput.value.trim();
            if (!prompt) return alert("Please explain what website or app you want to build!");

            promptInput.disabled = true;
            sendBtn.disabled = true;
            statusBar.innerHTML = "🤖 Contacting public engine matrix... Generating clean web layout...";

            const systemInstruction = "You are an elite front-end software architect. Build a complete, working, beautiful web app or game based on the user request. Return ONLY the raw HTML code combining internal CSS and JavaScript. Do NOT write conversational text, markdown formatting, or introductory explanations. Output 100% pure deployable source code.";

            try {
                // Using a reliable public browser gateway that permits cross-origin traffic
                const response = await fetch("https://pollinations.ai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: prompt }
                        ],
                        model: "qwen-coder", // Highly precise coding model
                        seed: Math.floor(Math.random() * 100000)
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}. Public cluster busy.`);
                }

                let cleanCode = await response.text();

                if (!cleanCode.trim()) {
                    throw new Error("Empty code response generated by target node.");
                }

                // Clean out any stray markdown code indicators the model wraps the output with
                cleanCode = cleanCode.replace(/^```html\s*/i, '').replace(/```\s*$/, '').trim();

                sandbox.srcdoc = cleanCode;
                statusBar.innerHTML = "✅ Generation Complete! Running your application live.";
                promptInput.value = "";

            } catch (error) {
                console.error(error);
                statusBar.innerHTML = "❌ Build process interrupted. Tap Build again to retry.";
                alert("Execution Error: " + error.message);
            } finally {
                promptInput.disabled = false;
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
