<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI App, Game & Web Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0f0f13; color: #e2e8f0; }
        header { padding: 15px; background: #1a1a24; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3d; }
        .logo { font-weight: bold; font-size: 1.1rem; color: #38bdf8; }
        #key-input { background: #2d2d3d; color: white; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; width: 140px; }
        #main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #preview-section { flex: 1; background: white; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        #status-bar { padding: 10px; background: #1a1a24; font-size: 0.85rem; color: #94a3b8; border-top: 1px solid #2d2d3d; }
        #input-area { display: flex; padding: 12px; background: #14141b; gap: 10px; border-top: 1px solid #2d2d3d; }
        textarea { flex: 1; height: 55px; background: #1f1f2e; color: white; border: 1px solid #3d3d5c; border-radius: 6px; padding: 10px; resize: none; font-size: 0.9rem; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        button { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🚀 Global AI Studio</div>
        <input type="password" id="key-input" placeholder="Paste Gemini Key to use">
    </header>

    <div id="main-container">
        <div id="preview-section">
            <iframe id="app-sandbox" srcdoc="<div style='font-family:sans-serif; text-align:center; padding-top:40px; color:#64748b;'><h3>Ready to generate!</h3><p style='font-size:0.9rem; margin-top:8px;'>Type a prompt below to build a full website, mobile app layout, or interactive game.</p></div>>"></iframe>
        </div>
        <div id="status-bar">Status: Awaiting your build instruction...</div>
    </div>

    <div id="input-area">
        <textarea id="user-prompt" placeholder="Describe your App, Website, or Game (e.g., 'A classic Snake game with retro graphics and scores')"></textarea>
        <button id="send-btn" onclick="generateOutput()">Build</button>
    </div>

    <script>
        async function generateOutput() {
            const promptInput = document.getElementById("user-prompt");
            const sendBtn = document.getElementById("send-btn");
            const statusBar = document.getElementById("status-bar");
            const sandbox = document.getElementById("app-sandbox");
            const keyInput = document.getElementById("key-input");

            const apiKey = keyInput.value.trim();
            const prompt = promptInput.value.trim();

            if (!apiKey) return alert("Please enter a free Gemini API Key in the top right box first!");
            if (!prompt) return alert("Please explain what website or app you want to build!");

            promptInput.disabled = true;
            sendBtn.disabled = true;
            statusBar.innerHTML = "🤖 Security Check Passed. Writing functional code layout...";

            const systemInstruction = `You are a world-class front-end software architect and security expert. 
Your goal is to build a fully operational, responsive, secure web project based on the user's prompt. 
It could be an interactive app, a complete modern website, or a game.
Requirements:
1. Provide a beautiful UI using clean embedded CSS. Make it look professional.
2. Ensure interactive elements work perfectly using embedded JavaScript.
3. Return ONLY pure, raw HTML content. 
4. DO NOT wrap the code in markdown code blocks (\`\`\`html). No chat fluff or warnings.`;

            try {
                const response = await fetch(`https://googleapis.com{apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemInstruction}\n\nUser Prompt: ${prompt}` }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API Error");
                }

                let cleanCode = data.candidates.content.parts.text;
                
                cleanCode = cleanCode.replace(/^```html\s*/i, '').replace(/```\s*$/, '').trim();

                sandbox.srcdoc = cleanCode;
                statusBar.innerHTML = "✅ Generation Complete! Testing application locally in sandbox.";
                promptInput.value = "";

            } catch (error) {
                console.error(error);
                statusBar.innerHTML = "❌ Build failed. Double check your API key validity.";
                alert("Error during execution: " + error.message);
            } finally {
                promptInput.disabled = false;
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
