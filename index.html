<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dual-Engine AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0f0f13; color: #e2e8f0; overflow: hidden; }
        header { padding: 12px; background: #1a1a24; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2d2d3d; }
        @media(min-width: 600px) { header { flex-direction: row; justify-content: space-between; align-items: center; } }
        .logo { font-weight: bold; font-size: 1.1rem; color: #38bdf8; letter-spacing: 0.05em; }
        .controls-group { display: flex; gap: 8px; width: 100%; max-width: 500px; }
        select { flex: 1; background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; outline: none; }
        #key-input { flex: 1; background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; padding: 8px; border-radius: 6px; font-size: 0.8rem; transition: border-color 0.2s; outline: none; }
        #key-input:focus, select:focus { border-color: #38bdf8; }
        #main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #preview-section { flex: 1; background: #ffffff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
        #status-text { padding: 10px 12px; background: #1a1a24; font-size: 0.8rem; color: #94a3b8; border-top: 1px solid #2d2d3d; font-weight: 500; }
        #input-area { display: flex; padding: 10px; background: #14141b; gap: 8px; border-top: 1px solid #2d2d3d; align-items: center; }
        textarea { flex: 1; height: 50px; background: #1f1f2e; color: #ffffff; border: 1px solid #3d3d5c; border-radius: 6px; padding: 10px; resize: none; font-size: 0.85rem; transition: border-color 0.2s; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 0 20px; height: 50px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; font-size: 0.9rem; }
        button:hover { background: #0369a1; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #4b5563; cursor: not-allowed; transform: none; }
    </style>
    <script type="module">
        import * as webllm from "https://esm.run";
        window.webllm = webllm;
    </script>
</head>
<body>

    <header>
        <div class="logo">🚀 Global AI Studio</div>
        <div class="controls-group">
            <select id="engine-select" onchange="toggleEngineLayout()">
                <option value="gemini">Cloud Engine: User Gemini Key</option>
                <option value="local">Local Engine: 100% Free Browser LLM</option>
            </select>
            <input type="password" id="key-input" placeholder="Enter Your Free Gemini Key" oninput="saveKeyLocally()">
        </div>
    </header>

    <div id="main-container">
        <div id="preview-section">
            <iframe id="app-sandbox" srcdoc="<div style='font-family:sans-serif; text-align:center; padding-top:60px; color:#64748b; padding-left:15px; padding-right:15px;'><h3>Pipeline Systems Active</h3><p style='font-size:0.9rem; margin-top:8px;'>Enter your prompt down below and click build to generate your app.</p></div>"></iframe>
        </div>
        <div id="status-text">Status: Systems online. Ready for compilation...</div>
    </div>

    <div id="input-area">
        <textarea id="user-prompt" placeholder="Describe the app you want to build..."></textarea>
        <button id="send-btn" onclick="generateOutput()">Build</button>
    </div>

    <script>
        let localEngineInstance = null;

        window.onload = function() {
            const savedKey = localStorage.getItem("user_gemini_key");
            if (savedKey) {
                document.getElementById("key-input").value = savedKey;
                document.getElementById("status-text").innerHTML = "✅ Saved API Key loaded securely into workspace.";
            }
        };

        function saveKeyLocally() {
            const keyVal = document.getElementById("key-input").value.trim();
            localStorage.setItem("user_gemini_key", keyVal);
        }

        function toggleEngineLayout() {
            const engine = document.getElementById("engine-select").value;
            const keyInput = document.getElementById("key-input");
            const statusBar = document.getElementById("status-text");

            if (engine === "local") {
                keyInput.style.display = "none";
                statusBar.innerHTML = "💡 Local Mode Active: Requires WebGPU compatibility layers.";
            } else {
                keyInput.style.display = "block";
                statusBar.innerHTML = "Status: Switched back to Cloud API routing pipeline.";
            }
        }

        async function generateOutput() {
            const promptInput = document.getElementById("user-prompt");
            const sendBtn = document.getElementById("send-btn");
            const statusBar = document.getElementById("status-text");
            const sandbox = document.getElementById("app-sandbox");
            const keyInput = document.getElementById("key-input");
            const selectedEngine = document.getElementById("engine-select").value;

            const apiKey = keyInput.value.trim();
            const userPromptText = promptInput.value.trim();

            if (!userPromptText) {
                return alert("Validation Alert: Input prompt cannot be empty.");
            }

            promptInput.disabled = true;
            sendBtn.disabled = true;

            // ================= TEST MODE GATEWAY =================
            if (apiKey === "test-mode") {
                statusBar.innerHTML = "🛠️ [TEST MODE] Injecting test application framework layout...";
                await new Promise(r => setTimeout(r, 1000));
                sandbox.srcdoc = `<!DOCTYPE html><html><body style="background:#14141b; color:white; font-family:sans-serif; text-align:center; padding:20px;"><h2>📊 Sandboxed App Active!</h2><p style='color:#aaa; font-size:0.9rem;'>Test pass complete.</p></body></html>`;
                statusBar.innerHTML = "✅ Test Successful! Layout rendering pipeline online.";
                promptInput.disabled = false;
                sendBtn.disabled = false;
                return;
            }

            const engineeringInstruction = `You are an elite web architect. Build a 100% complete, standalone Data Modeling & Charting dashboard application. Must include client-side interactive SVG charts (Bar/Line/Scatter), dynamic analytical operations (Mean, Regression y=mx+b), localized zero-trust data sandbox badges, and an instant dynamic dropdown global language translation engine. Output ONLY raw, production valid HTML/JS. Do NOT wrap inside markdown blocks. No explanations outside the code elements. Start with <!DOCTYPE html>.`;

            // ================= ENGINE 1: LOCAL RUNTIME =================
            if (selectedEngine === "local") {
                try {
                    if (!navigator.gpu) {
                        throw new Error("Your phone's browser does not support WebGPU layers. Switch to Cloud Engine.");
                    }
                    statusBar.innerHTML = "📦 Spinning up local browser neural layer arrays...";
                    if (!localEngineInstance) {
                        localEngineInstance = await window.webllm.CreateEngine("Phi3-mini-128k-instruct-q4f16_1-MLC");
                    }
                    const messageMatrix = [{ role: "system", content: engineeringInstruction }, { role: "user", content: userPromptText }];
                    const chunks = await localEngineInstance.chat.completions.create({ messages: messageMatrix });
                    let localResultStr = chunks.choices[0].message.content.trim();
                    localResultStr = localResultStr.replace(/^```html\s*/i, '').replace(/```\s*$/, '').trim();
                    sandbox.srcdoc = localResultStr;
                    statusBar.innerHTML = "✅ Local Generation Complete!";
                } catch (localErr) {
                    statusBar.innerHTML = "❌ Device Execution Error: " + localErr.message;
                } finally {
                    promptInput.disabled = false;
                    sendBtn.disabled = false;
                }
                return;
            }

            // ================= ENGINE 2: CLOUD RUNTIME =================
            if (!apiKey) {
                promptInput.disabled = false;
                sendBtn.disabled = false;
                return alert("Security Check: Please enter your Gemini API key inside the input selector field first.");
            }

            const targetedModels = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-1.5-pro"];

            for (let model of targetedModels) {
                try {
                    statusBar.innerHTML = `🤖 Compiling data engine code structure via ${model}...`;
                    const secureSafeEndpoint = `https://googleapis.com{model}:generateContent?key=${apiKey}`;

                    const response = await fetch(secureSafeEndpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: engineeringInstruction + "\n\nUser Request: " + userPromptText }] }] })
                    });

                    if (!response.ok) {
